<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial glow gradients -->
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08080c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0070f3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#08080c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#00dfd8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#08080c" stop-opacity="0" />
    </radialGradient>

    <!-- Linear gradient for name highlight -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Subtle border gradient -->
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0070f3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0.3" />
    </linearGradient>

    <style>
      @keyframes float-1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.8; }
        50% { transform: translate(120px, 20px) scale(1.15); opacity: 1; }
      }
      @keyframes float-2 {
        0%, 100% { transform: translate(0px, 0px) scale(1.1); opacity: 0.7; }
        50% { transform: translate(-100px, -25px) scale(0.9); opacity: 0.95; }
      }
      @keyframes float-3 {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.6; }
        50% { transform: translate(60px, -30px); opacity: 0.9; }
      }
      @keyframes pulse-green {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.2); }
      }

      .glow-orb-1 { animation: float-1 10s ease-in-out infinite; transform-origin: center; }
      .glow-orb-2 { animation: float-2 13s ease-in-out infinite; transform-origin: center; }
      .glow-orb-3 { animation: float-3 8s ease-in-out infinite; transform-origin: center; }
      .live-dot { animation: pulse-green 2s ease-in-out infinite; transform-origin: center; }

      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.03em;
        fill: url(#text-gradient);
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: #818CF8;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        fill: #9CA3AF;
        letter-spacing: -0.01em;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #34D399;
        letter-spacing: 0.02em;
      }
      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #D1D5DB;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="860" height="200" rx="16" fill="#08080C" />
  <rect width="858" height="198" x="1" y="1" rx="15" stroke="url(#border-gradient)" stroke-width="1.5" fill="none" />

  <!-- Animated Ambient Glow Orbs -->
  <g opacity="0.85">
    <circle cx="180" cy="50" r="140" fill="url(#glow-purple)" class="glow-orb-1" />
    <circle cx="680" cy="140" r="160" fill="url(#glow-blue)" class="glow-orb-2" />
    <circle cx="440" cy="100" r="120" fill="url(#glow-cyan)" class="glow-orb-3" />
  </g>

  <!-- Content Block -->
  <g transform="translate(48, 42)">
    <!-- Top Pill: Status -->
    <rect width="215" height="24" rx="12" fill="#1E1B4B" fill-opacity="0.6" stroke="#4338CA" stroke-opacity="0.5" stroke-width="1" />
    <text x="14" y="16" class="tag">CSE CORE · CLASS OF '28</text>

    <!-- Main Title -->
    <text x="0" y="66" class="title">AKHOURI PRAKHAR</text>

    <!-- Subtitle -->
    <text x="0" y="96" class="subtitle">Full-Stack Web Development · Cloud Systems · Intelligent Automation</text>

    <!-- Bottom Highlights Chips -->
    <g transform="translate(0, 114)">
      <!-- Status Badge -->
      <rect width="180" height="26" rx="13" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10B981" class="live-dot" />
      <text x="26" y="17" class="badge-text">Building in Public</text>

      <!-- Focus Chips -->
      <g transform="translate(192, 0)">
        <rect width="86" height="26" rx="13" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" />
        <text x="43" y="17" text-anchor="middle" class="chip-text">C++ &amp; DSA</text>
      </g>
      <g transform="translate(288, 0)">
        <rect width="100" height="26" rx="13" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" />
        <text x="50" y="17" text-anchor="middle" class="chip-text">React &amp; Node</text>
      </g>
      <g transform="translate(398, 0)">
        <rect width="112" height="26" rx="13" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" />
        <text x="56" y="17" text-anchor="middle" class="chip-text">Cloud Basics</text>
      </g>
    </g>
  </g>
</svg>
