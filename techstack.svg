<svg width="860" height="280" viewBox="0 0 860 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", Consolas, Monaco, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .cat-title { font-size: 11px; font-weight: 700; fill: #10B981; letter-spacing: 0.1em; }
      .pill-text { font-size: 12px; font-weight: 600; fill: #E2E8F0; }
      .pill-bg { fill: #111622; stroke: #1F293D; stroke-width: 1px; rx: 8px; transition: all 0.2s; }
      .pill:hover .pill-bg { fill: #1A2234; stroke: #10B981; }
      .pill:hover .pill-text { fill: #34D399; }
    </style>
  </defs>

  <rect width="860" height="280" rx="16" fill="#0A0D14" stroke="#1E293B" stroke-width="1.2" />

  <!-- SECTION 1: LANGUAGES & CORE SYSTEMS -->
  <g transform="translate(32, 26)">
    <text x="0" y="0" class="mono cat-title">LANGUAGES &amp; CORE SYSTEMS</text>
    <g transform="translate(0, 14)">
      <!-- C++ -->
      <g class="pill" transform="translate(0, 0)">
        <title>C++ · Data Structures &amp; Algorithms (Striver A2Z, LeetCode, GATE CS)</title>
        <rect width="118" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#00599C" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">C++</text>
        <text x="34" y="22" class="sans pill-text">C++ (DSA)</text>
      </g>
      <!-- Python -->
      <g class="pill" transform="translate(126, 0)">
        <title>Python · Async bots, FastAPI, Pandas data pipelines &amp; Semgrep</title>
        <rect width="112" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#3776AB" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFD43B">Py</text>
        <text x="34" y="22" class="sans pill-text">Python</text>
      </g>
      <!-- JavaScript -->
      <g class="pill" transform="translate(246, 0)">
        <title>JavaScript · Modern ES6+, DOM manipulation, Service Workers &amp; PWAs</title>
        <rect width="124" height="34" class="pill-bg" />
        <rect x="10" y="9" width="16" height="16" rx="2" fill="#F7DF1E" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#000">JS</text>
        <text x="34" y="22" class="sans pill-text">JavaScript</text>
      </g>
      <!-- TypeScript -->
      <g class="pill" transform="translate(378, 0)">
        <title>TypeScript · Type-safe application engineering</title>
        <rect width="124" height="34" class="pill-bg" />
        <rect x="10" y="9" width="16" height="16" rx="2" fill="#3178C6" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">TS</text>
        <text x="34" y="22" class="sans pill-text">TypeScript</text>
      </g>
      <!-- Java -->
      <g class="pill" transform="translate(510, 0)">
        <title>Java · Object-Oriented Architecture &amp; JavaFX</title>
        <rect width="104" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#EA2D2E" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">J</text>
        <text x="34" y="22" class="sans pill-text">Java</text>
      </g>
      <!-- SQL & SQLite -->
      <g class="pill" transform="translate(622, 0)">
        <title>SQL &amp; SQLite · Relational schemas, indexing &amp; local persistence</title>
        <rect width="174" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#003B57" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="7" font-weight="800" fill="#FFF">SQL</text>
        <text x="34" y="22" class="sans pill-text">SQLite / PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: FRAMEWORKS & STATIC ANALYSIS -->
  <g transform="translate(32, 108)">
    <text x="0" y="0" class="mono cat-title">FRAMEWORKS, STATIC ANALYSIS &amp; UI</text>
    <g transform="translate(0, 14)">
      <!-- React 18 -->
      <g class="pill" transform="translate(0, 0)">
        <title>React 18 · Vite, state machines, component architecture &amp; dashboard UIs</title>
        <rect width="118" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#20232A" stroke="#61DAFB" stroke-width="1.2" />
        <circle cx="18" cy="17" r="2" fill="#61DAFB" />
        <text x="34" y="22" class="sans pill-text">React 18</text>
      </g>
      <!-- Next.js 16 -->
      <g class="pill" transform="translate(126, 0)">
        <title>Next.js 16 · Modern edge SSR, App Router &amp; client platforms</title>
        <rect width="118" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#000" stroke="#FFF" stroke-width="0.8" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">N</text>
        <text x="34" y="22" class="sans pill-text">Next.js 16</text>
      </g>
      <!-- FastAPI -->
      <g class="pill" transform="translate(252, 0)">
        <title>FastAPI · Asynchronous Python REST APIs &amp; statutory compliance servers</title>
        <rect width="116" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#059669" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">API</text>
        <text x="34" y="22" class="sans pill-text">FastAPI</text>
      </g>
      <!-- Semgrep -->
      <g class="pill" transform="translate(376, 0)">
        <title>Semgrep · Custom AST YAML rules for statutory privacy &amp; DPDP compliance</title>
        <rect width="128" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#10B981">AST</text>
        <text x="34" y="22" class="sans pill-text">Semgrep AST</text>
      </g>
      <!-- Vite & Tailwind -->
      <g class="pill" transform="translate(512, 0)">
        <title>Tailwind CSS &amp; Vite · Modern rapid UI styling &amp; bundler</title>
        <rect width="144" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#06B6D4" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">UI</text>
        <text x="34" y="22" class="sans pill-text">Tailwind / Vite</text>
      </g>
      <!-- Pandas -->
      <g class="pill" transform="translate(664, 0)">
        <title>Pandas &amp; Data Ops · Automated payroll reconciliation &amp; dataset processing</title>
        <rect width="132" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#150458" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="7" font-weight="800" fill="#E70488">PD</text>
        <text x="34" y="22" class="sans pill-text">Pandas Ops</text>
      </g>
    </g>
  </g>

  <!-- SECTION 3: CLOUD, EDGE & DEVOPS -->
  <g transform="translate(32, 190)">
    <text x="0" y="0" class="mono cat-title">CLOUD, EDGE PLATFORMS &amp; WORKFLOWS</text>
    <g transform="translate(0, 14)">
      <!-- AWS -->
      <g class="pill" transform="translate(0, 0)">
        <title>Amazon Web Services · EC2, DNS, Chapter Cloud Infrastructure</title>
        <rect width="112" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#FF9900" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="7" font-weight="800" fill="#000">AWS</text>
        <text x="34" y="22" class="sans pill-text">AWS Cloud</text>
      </g>
      <!-- Azure -->
      <g class="pill" transform="translate(120, 0)">
        <title>Microsoft Azure · Azure Static Web Apps, staging pipelines (beta2.orchvate.com)</title>
        <rect width="146" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#0078D4" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">AZ</text>
        <text x="34" y="22" class="sans pill-text">Azure Static Apps</text>
      </g>
      <!-- Cloudflare Pages -->
      <g class="pill" transform="translate(274, 0)">
        <title>Cloudflare Pages · Zero-cold-start edge deployments (careathomeranchi.com)</title>
        <rect width="154" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#F38020" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">CF</text>
        <text x="34" y="22" class="sans pill-text">Cloudflare Pages</text>
      </g>
      <!-- Docker -->
      <g class="pill" transform="translate(436, 0)">
        <title>Docker · Containerized local development &amp; reproducible execution</title>
        <rect width="114" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#2496ED" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">DOC</text>
        <text x="34" y="22" class="sans pill-text">Docker</text>
      </g>
      <!-- Git & GitHub -->
      <g class="pill" transform="translate(558, 0)">
        <title>Git &amp; GitHub · Branch governance, PR reviews &amp; CI workflows</title>
        <rect width="118" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#F05032" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">GIT</text>
        <text x="34" y="22" class="sans pill-text">Git / CI</text>
      </g>
      <!-- Linux & Ghostty -->
      <g class="pill" transform="translate(684, 0)">
        <title>Linux &amp; Ghostty · Apple Silicon M5, Linux Mint, terminal-first workflows</title>
        <rect width="112" height="34" class="pill-bg" />
        <circle cx="18" cy="17" r="8" fill="#FCC624" />
        <text x="18" y="21" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#000">OS</text>
        <text x="34" y="22" class="sans pill-text">Linux / macOS</text>
      </g>
    </g>
  </g>
</svg>
