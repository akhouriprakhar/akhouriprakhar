<svg width="860" height="240" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", Consolas, Monaco, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .cat-title { font-size: 11px; font-weight: 700; fill: #10B981; letter-spacing: 0.1em; }
      .pill-text { font-size: 12.5px; font-weight: 600; fill: #E2E8F0; }
      .pill-bg { fill: #111622; stroke: #1F293D; stroke-width: 1px; rx: 8px; transition: all 0.2s; }
      .pill:hover .pill-bg { fill: #1A2234; stroke: #10B981; }
      .pill:hover .pill-text { fill: #34D399; }
    </style>
  </defs>

  <rect width="860" height="240" rx="16" fill="#0A0D14" stroke="#1E293B" stroke-width="1.2" />

  <!-- SECTION 1: LANGUAGES & DATA -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="mono cat-title">LANGUAGES &amp; DATA SYSTEMS</text>
    <g transform="translate(0, 16)">
      <!-- C++ -->
      <g class="pill" transform="translate(0, 0)">
        <title>C++ · Algorithms &amp; High-Performance Systems</title>
        <rect width="118" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#00599C" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="9" font-weight="800" fill="#FFF">C++</text>
        <text x="38" y="23" class="sans pill-text">C++</text>
      </g>
      <!-- Python -->
      <g class="pill" transform="translate(128, 0)">
        <title>Python 3.12+ · Scripting, Automation &amp; AST Engines</title>
        <rect width="128" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#3776AB" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="9" font-weight="800" fill="#FFD43B">Py</text>
        <text x="38" y="23" class="sans pill-text">Python</text>
      </g>
      <!-- Java -->
      <g class="pill" transform="translate(266, 0)">
        <title>Java · Object-Oriented Architecture</title>
        <rect width="118" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#EA2D2E" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="9" font-weight="800" fill="#FFF">J</text>
        <text x="38" y="23" class="sans pill-text">Java</text>
      </g>
      <!-- TypeScript -->
      <g class="pill" transform="translate(394, 0)">
        <title>TypeScript · Type-Safe Client &amp; Portal Systems</title>
        <rect width="144" height="36" class="pill-bg" />
        <rect x="11" y="9" width="18" height="18" rx="3" fill="#3178C6" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="9" font-weight="800" fill="#FFF">TS</text>
        <text x="38" y="23" class="sans pill-text">TypeScript</text>
      </g>
      <!-- C -->
      <g class="pill" transform="translate(548, 0)">
        <title>C · Core Systems &amp; Low-Level Memory</title>
        <rect width="100" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#A8B9CC" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#0A0D14">C</text>
        <text x="38" y="23" class="sans pill-text">C</text>
      </g>
      <!-- PostgreSQL / SQL -->
      <g class="pill" transform="translate(658, 0)">
        <title>PostgreSQL &amp; MySQL · Relational Schemas &amp; Queries</title>
        <rect width="138" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#336791" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="9" font-weight="800" fill="#FFF">SQL</text>
        <text x="38" y="23" class="sans pill-text">PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: FRAMEWORKS, CLOUD & INFRASTRUCTURE -->
  <g transform="translate(32, 116)">
    <text x="0" y="0" class="mono cat-title">FRAMEWORKS, CLOUD &amp; DEVOPS WORKFLOWS</text>
    <g transform="translate(0, 16)">
      <!-- FastAPI -->
      <g class="pill" transform="translate(0, 0)">
        <title>FastAPI · High-Performance Asynchronous Python APIs</title>
        <rect width="128" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#059669" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="9" font-weight="800" fill="#FFF">API</text>
        <text x="38" y="23" class="sans pill-text">FastAPI</text>
      </g>
      <!-- React -->
      <g class="pill" transform="translate(138, 0)">
        <title>React 19 · Modern Responsive Frontend Dashboards</title>
        <rect width="118" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#20232A" stroke="#61DAFB" stroke-width="1.5" />
        <circle cx="20" cy="18" r="2.5" fill="#61DAFB" />
        <text x="38" y="23" class="sans pill-text">React</text>
      </g>
      <!-- Docker -->
      <g class="pill" transform="translate(266, 0)">
        <title>Docker · Containerized Environments &amp; Isolation</title>
        <rect width="124" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#2496ED" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">DOC</text>
        <text x="38" y="23" class="sans pill-text">Docker</text>
      </g>
      <!-- AWS -->
      <g class="pill" transform="translate(400, 0)">
        <title>Amazon Web Services · Cloud Architecture</title>
        <rect width="114" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#FF9900" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#000">AWS</text>
        <text x="38" y="23" class="sans pill-text">AWS</text>
      </g>
      <!-- Azure -->
      <g class="pill" transform="translate(524, 0)">
        <title>Microsoft Azure · Cloud Staging &amp; Deployment</title>
        <rect width="118" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#0078D4" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">AZ</text>
        <text x="38" y="23" class="sans pill-text">Azure</text>
      </g>
      <!-- Linux & Git -->
      <g class="pill" transform="translate(652, 0)">
        <title>Linux &amp; Git · Unix Shell &amp; Version Control</title>
        <rect width="144" height="36" class="pill-bg" />
        <circle cx="20" cy="18" r="9" fill="#F05032" />
        <text x="20" y="22" text-anchor="middle" class="sans" font-size="8" font-weight="800" fill="#FFF">GIT</text>
        <text x="38" y="23" class="sans pill-text">Linux &amp; Git</text>
      </g>
    </g>
  </g>
</svg>