<svg width="860" height="310" viewBox="0 0 860 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ambient Glow Gradients -->
    <radialGradient id="emerald-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080B11" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-glow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080B11" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Frame Border Gradient -->
    <linearGradient id="frame-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="name-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes beacon { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.4; } }
      .cursor { animation: blink 1s step-start infinite; }
      .beacon-dot { animation: beacon 2s ease-in-out infinite; transform-origin: center; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Monaco, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="860" height="310" rx="16" fill="#0A0D14" />
  <rect width="858" height="308" x="1" y="1" rx="15" stroke="url(#frame-border)" stroke-width="1.5" fill="none" />

  <!-- Ambient Light Fields -->
  <circle cx="200" cy="90" r="180" fill="url(#emerald-glow)" />
  <circle cx="700" cy="220" r="190" fill="url(#purple-glow)" />

  <!-- Window Title Bar -->
  <rect width="858" height="42" x="1" y="1" rx="15" fill="#111622" fill-opacity="0.8" />
  <line x1="1" y1="42" x2="859" y2="42" stroke="#1F293D" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444" />
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B" />
  <circle cx="60" cy="21" r="5.5" fill="#10B981" />

  <!-- Title -->
  <text x="430" y="26" text-anchor="middle" class="mono" font-size="12" fill="#94A3B8" letter-spacing="0.04em">prakhar@system-core ~ % environment --summary</text>

  <!-- Live Status Badge -->
  <g transform="translate(685, 11)">
    <rect width="150" height="22" rx="11" fill="#064E3B" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
    <circle cx="14" cy="11" r="3.5" fill="#34D399" class="beacon-dot" />
    <text x="25" y="15" class="mono" font-size="10.5" font-weight="600" fill="#34D399" letter-spacing="0.06em">ONLINE · CSE '28</text>
  </g>

  <!-- Content Block -->
  <g transform="translate(36, 74)">
    <!-- Command 1: Identity -->
    <text x="0" y="0" class="mono" font-size="13" fill="#10B981" font-weight="600">$ whoami</text>
    <text x="0" y="32" class="sans" font-size="32" font-weight="800" fill="url(#name-gradient)" letter-spacing="-0.02em">Akhouri Prakhar</text>
    <text x="0" y="58" class="mono" font-size="13" fill="#94A3B8">
      Prakhar · Pursuing <tspan fill="#34D399" font-weight="600">B.Tech in Computer Science &amp; Engineering</tspan> (Class of 2028)
    </text>

    <!-- Horizontal Divider -->
    <line x1="0" y1="76" x2="788" y2="76" stroke="#1E293B" stroke-dasharray="4 4" stroke-width="1" />

    <!-- Command 2: Functional System Environment Report -->
    <g transform="translate(0, 102)">
      <text x="0" y="0" class="mono" font-size="13" fill="#8B5CF6" font-weight="600">$ cat system_runtime.env</text>

      <!-- Terminal Environment Shell Window -->
      <g transform="translate(0, 14)">
        <rect width="788" height="78" rx="8" fill="#0B111E" stroke="#1E293B" stroke-width="1" />

        <!-- Column 1: Core Technical Track -->
        <g transform="translate(20, 24)">
          <text x="0" y="0" class="mono" font-size="12" fill="#64748B">TRACK     <tspan fill="#F8FAFC">Computer Science &amp; Engineering</tspan></text>
          <text x="0" y="20" class="mono" font-size="12" fill="#64748B">FOCUS     <tspan fill="#34D399">AI Detection Engines · Security Analysis · Automation</tspan></text>
          <text x="0" y="40" class="mono" font-size="12" fill="#64748B">CORE CS   <tspan fill="#60A5FA">Data Structures &amp; Algorithms (C++) · Systems Logic</tspan></text>
        </g>

        <!-- Column 2: Practical Deliverables & Sprints -->
        <g transform="translate(480, 24)">
          <text x="0" y="0" class="mono" font-size="12" fill="#64748B">HACKATHONS <tspan fill="#A78BFA">36h Sprints (Veylance AI, JusTrace)</tspan></text>
          <text x="0" y="20" class="mono" font-size="12" fill="#64748B">PLATFORMS  <tspan fill="#F8FAFC">macOS · Linux · Docker · AWS · Azure</tspan></text>
          <text x="0" y="40" class="mono" font-size="12" fill="#64748B">STATUS     <tspan fill="#34D399">🟢 Active Builder · Shipping in Public</tspan></text>
        </g>
      </g>
    </g>

    <!-- Bottom Active Prompt -->
    <g transform="translate(0, 218)">
      <text x="0" y="0" class="mono" font-size="12" fill="#64748B">
        <tspan fill="#10B981">➜</tspan> <tspan fill="#38BDF8">~/workspace</tspan> <tspan fill="#64748B">git:(main)</tspan> <tspan fill="#F1F5F9">make build-production</tspan><tspan fill="#34D399" class="cursor">_</tspan>
      </text>
    </g>
  </g>
</svg>
